<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#14142b"/>
      <stop offset="100%" stop-color="#1c0f1c"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#131322"/>
    </linearGradient>
    <filter id="shopGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#shopBg)"/>

  <!-- Left: E-Commerce Storefront UI Cards -->
  <g transform="translate(90, 80)">
    <!-- Main Product Card -->
    <rect x="0" y="0" width="260" height="280" rx="16" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Image placeholder area -->
    <rect x="18" y="18" width="224" height="130" rx="10" fill="#282846"/>
    
    <!-- Stylized Bag / Cart glyph -->
    <g transform="translate(105, 55)">
      <path d="M 10 20 L 10 45 C 10 48 12 50 15 50 L 35 50 C 38 50 40 48 40 45 L 40 20 Z" fill="#e50914" opacity="0.9"/>
      <path d="M 17 20 C 17 12 33 12 33 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Product Titles & Ratings -->
    <rect x="18" y="162" width="130" height="12" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="18" y="182" width="80" height="8" rx="3" fill="#9ca3af"/>
    
    <!-- Price & Add to Cart button -->
    <g transform="translate(18, 215)">
      <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">$189.00</text>
      
      <rect x="120" y="0" width="104" height="34" rx="8" fill="#e50914" filter="url(#shopGlow)"/>
      <text x="172" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ Add Cart</text>
    </g>
  </g>

  <!-- Right: Info -->
  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="rgba(229,9,20,0.18)" stroke="#e50914" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#e50914"/>
    <text x="88" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WEB DEVELOPMENT</text>

    <text x="0" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Dev Shopee</text>
    <text x="0" y="102" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Full-Stack Digital Commerce Storefront Experience</text>

    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Dynamic Catalog</text>

      <rect x="160" y="0" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="235" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cart Lifecycle</text>

      <rect x="0" y="44" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="65" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Checkout Simulation</text>

      <rect x="160" y="44" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="235" y="65" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Zero Layout Shift</text>
    </g>

    <g transform="translate(0, 245)">
      <text x="0" y="0" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="600">REACT • NEXT.JS • TAILWIND CSS • NODE.JS</text>
    </g>
  </g>
</svg>
