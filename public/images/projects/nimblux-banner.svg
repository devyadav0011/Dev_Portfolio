<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="nimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="50%" stop-color="#180e22"/>
      <stop offset="100%" stop-color="#220b12"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="nimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#nimGrad)"/>

  <!-- Background Constellation Network -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1.2">
    <line x1="80" y1="120" x2="220" y2="80"/>
    <line x1="220" y1="80" x2="340" y2="160"/>
    <line x1="340" y1="160" x2="260" y2="280"/>
    <line x1="260" y1="280" x2="140" y2="240"/>
    <line x1="140" y1="240" x2="80" y2="120"/>
    <line x1="220" y1="80" x2="260" y2="280"/>
    
    <circle cx="80" cy="120" r="4" fill="#ff334b"/>
    <circle cx="220" cy="80" r="5" fill="#ffffff"/>
    <circle cx="340" cy="160" r="6" fill="#7928ca"/>
    <circle cx="260" cy="280" r="5" fill="#ff334b"/>
    <circle cx="140" cy="240" r="4" fill="#ffffff"/>
  </g>

  <!-- Glowing Aura -->
  <circle cx="240" cy="200" r="130" fill="#ff2a38" opacity="0.15" filter="url(#nimGlow)"/>
  <circle cx="600" cy="220" r="160" fill="#7928ca" opacity="0.15" filter="url(#nimGlow)"/>

  <!-- Left: Emblem / Hexagon Shield with "N" -->
  <g transform="translate(140, 100)">
    <!-- Hexagon Outer -->
    <polygon points="100,0 200,58 200,174 100,232 0,174 0,58" fill="#120e20" stroke="url(#orbGrad)" stroke-width="3" filter="url(#nimGlow)"/>
    
    <!-- Stylized Modern 'N' Lettermark -->
    <path d="M 60 170 L 60 70 L 85 70 L 115 130 L 115 70 L 140 70 L 140 170 L 115 170 L 85 110 L 85 170 Z" fill="#ffffff"/>
    
    <!-- Small community badge below -->
    <g transform="translate(15, 200)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#1b122c" stroke="#ff334b" stroke-width="1.5"/>
      <text x="85" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FOUNDER INITIATIVE</text>
    </g>
  </g>

  <!-- Right: Information & Milestone Badges -->
  <g transform="translate(430, 95)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="165" height="26" rx="13" fill="rgba(255,42,56,0.18)" stroke="#ff2a38" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#ff2a38"/>
    <text x="90" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STARTUP &amp; COMMUNITY</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">NIMBLUX</text>
    <text x="0" y="105" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Technology, Hackathons &amp; Student Ecosystem</text>

    <!-- Milestone Cards -->
    <g transform="translate(0, 135)">
      <!-- Milestone 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="150" height="76" rx="12" fill="#151124" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="16" y="32" fill="#ff4d61" font-family="system-ui, sans-serif" font-size="24" font-weight="900">5000+</text>
        <text x="16" y="52" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Nimblux Members</text>
        <text x="16" y="66" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Active Community</text>
      </g>

      <!-- Milestone 2 -->
      <g transform="translate(162, 0)">
        <rect x="0" y="0" width="155" height="76" rx="12" fill="#151124" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="16" y="32" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="24" font-weight="900">600+</text>
        <text x="16" y="52" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ORVIX Hackathon</text>
        <text x="16" y="66" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Participating Teams</text>
      </g>
    </g>

    <!-- Highlights text -->
    <g transform="translate(0, 245)">
      <text x="0" y="0" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12" font-weight="500">
        Campus Ambassador Program • Student Hackathons • Tech Innovation
      </text>
    </g>
  </g>
</svg>
