<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="50%" stop-color="#141124"/>
      <stop offset="100%" stop-color="#1f0a14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glow effects -->
  <circle cx="620" cy="180" r="140" fill="#e50914" opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="280" r="130" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Left: Stylized Resume / ATS Document Mockup -->
  <g transform="translate(100, 75)">
    <!-- Main document shadow & card -->
    <rect x="0" y="0" width="240" height="310" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Top badge -->
    <rect x="24" y="24" width="70" height="8" rx="4" fill="#e50914"/>
    <rect x="100" y="24" width="40" height="8" rx="4" fill="#8b5cf6" opacity="0.7"/>

    <!-- Document title & lines -->
    <rect x="24" y="48" width="130" height="12" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="24" y="70" width="190" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="24" y="84" width="170" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="24" y="98" width="180" height="6" rx="3" fill="#ffffff" opacity="0.3"/>

    <!-- Section: Experience with scan highlight -->
    <rect x="24" y="124" width="90" height="10" rx="3" fill="#8b5cf6" opacity="0.8"/>
    <rect x="24" y="144" width="192" height="42" rx="8" fill="rgba(229,9,20,0.12)" stroke="#e50914" stroke-width="1"/>
    <rect x="36" y="156" width="100" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="36" y="168" width="160" height="5" rx="2" fill="#ffffff" opacity="0.4"/>

    <!-- Scan beam -->
    <line x1="16" y1="165" x2="224" y2="165" stroke="#e50914" stroke-width="2" filter="url(#glow)"/>

    <!-- Skills pills -->
    <rect x="24" y="202" width="50" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>
    <rect x="80" y="202" width="60" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>
    <rect x="146" y="202" width="55" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>

    <!-- ATS Match Floating Badge -->
    <g transform="translate(150, 240)">
      <rect x="0" y="0" width="110" height="54" rx="12" fill="#181a26" stroke="#e50914" stroke-width="1.5" filter="url(#glow)"/>
      <text x="55" y="24" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ATS SCORE</text>
      <text x="55" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">98.5%</text>
    </g>
  </g>

  <!-- Right side: Cinematic Branding & Feature Highlights -->
  <g transform="translate(410, 110)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="110" height="26" rx="13" fill="rgba(229,9,20,0.18)" stroke="#e50914" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#e50914"/>
    <text x="60" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI &amp; SAAS</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">CareerLense</text>
    
    <!-- Tagline -->
    <text x="0" y="105" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="15" font-weight="500">AI Resume Intelligence &amp; ATS Optimization</text>
    
    <!-- Feature tags -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="145" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="72" y="20" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ Resume Analyzer</text>

      <rect x="155" y="0" width="135" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="222" y="20" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ AI Suggestions</text>

      <rect x="0" y="44" width="135" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="67" y="64" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ ATS Grading</text>

      <rect x="145" y="44" width="145" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="217" y="64" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ Job Matching</text>
    </g>

    <!-- Bottom Tech Pill Stack -->
    <g transform="translate(0, 245)">
      <text x="0" y="0" fill="#71717a" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">NEXT.JS • TYPESCRIPT • TAILWIND • OPENAI • POSTGRES</text>
    </g>
  </g>
</svg>
