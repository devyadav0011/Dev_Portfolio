<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#190e1a"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <radialGradient id="voiceOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="60%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#2f1118"/>
    </radialGradient>
    <filter id="voiceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#aiBg)"/>

  <!-- Left: Concentric Sound Wave & Voice Orb -->
  <g transform="translate(220, 225)">
    <!-- Concentric Wave Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(229,9,20,0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="125" fill="none" stroke="rgba(255,71,87,0.25)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="68" fill="url(#voiceOrb)" filter="url(#voiceGlow)"/>

    <!-- Acoustic soundwave bars -->
    <g fill="#ffffff" opacity="0.9">
      <rect x="-35" y="-12" width="4" height="24" rx="2"/>
      <rect x="-25" y="-22" width="4" height="44" rx="2"/>
      <rect x="-15" y="-36" width="4" height="72" rx="2"/>
      <rect x="-5" y="-48" width="4" height="96" rx="2"/>
      <rect x="5" y="-48" width="4" height="96" rx="2"/>
      <rect x="15" y="-36" width="4" height="72" rx="2"/>
      <rect x="25" y="-22" width="4" height="44" rx="2"/>
      <rect x="35" y="-12" width="4" height="24" rx="2"/>
    </g>

    <!-- Floating status pill -->
    <g transform="translate(-75, 95)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#13151f" stroke="#ff4757" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#22c55e"/>
      <text x="82" y="19" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">LISTENING MODE</text>
    </g>
  </g>

  <!-- Right: Details -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="135" height="26" rx="13" fill="rgba(229,9,20,0.18)" stroke="#e50914" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#e50914"/>
    <text x="75" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI EXPERIMENTS</text>

    <text x="0" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Brahmastra AI</text>
    <text x="0" y="102" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Voice-Powered Desktop Assistant &amp; Query Engine</text>

    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Speech Recognition</text>

      <rect x="160" y="0" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="235" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Task Automation</text>

      <rect x="0" y="44" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="65" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Conversational NLP</text>

      <rect x="160" y="44" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="235" y="65" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Modular Plugins</text>
    </g>

    <g transform="translate(0, 245)">
      <text x="0" y="0" fill="#f87171" font-family="monospace" font-size="11" font-weight="600">PYTHON • SPEECH RECOGNITION • NLP • OPENAI API</text>
    </g>
  </g>
</svg>
