<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="wmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="50%" stop-color="#0b171c"/>
      <stop offset="100%" stop-color="#140912"/>
    </linearGradient>
    <filter id="wmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#wmBg)"/>

  <!-- Tech Grid Background -->
  <g stroke="rgba(16,185,129,0.06)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="240" cy="220" r="140" fill="#10b981" opacity="0.12" filter="url(#wmGlow)"/>
  <circle cx="640" cy="200" r="130" fill="#e50914" opacity="0.15" filter="url(#wmGlow)"/>

  <!-- Left: Computer Vision Inpainting Terminal Mockup -->
  <g transform="translate(80, 80)">
    <!-- Terminal Window -->
    <rect x="0" y="0" width="280" height="280" rx="16" fill="#0d1117" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    
    <!-- Window controls -->
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="24" fill="#6e7681" font-family="monospace" font-size="11">cv2_watermark_inpaint.py</text>

    <!-- Simulated Image Canvas -->
    <rect x="20" y="45" width="240" height="150" rx="10" fill="#161b22" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Image Landscape Simulation -->
    <path d="M 30 170 Q 80 100 140 140 T 250 120 L 250 185 L 30 185 Z" fill="#21262d"/>
    <circle cx="80" cy="85" r="18" fill="#30363d"/>

    <!-- Watermark target zone box -->
    <rect x="155" y="140" width="90" height="36" rx="4" fill="rgba(229,9,20,0.18)" stroke="#e50914" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="162" y="156" fill="#f87171" font-family="monospace" font-size="9" font-weight="700">[GEMINI WM]</text>
    <text x="162" y="169" fill="#34d399" font-family="monospace" font-size="9">→ INPAINT OK</text>

    <!-- Scan Line -->
    <line x1="20" y1="120" x2="260" y2="120" stroke="#10b981" stroke-width="1.5" filter="url(#wmGlow)"/>

    <!-- Console Terminal logs -->
    <g transform="translate(20, 212)">
      <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="10">$ python inpaint.py --mask auto</text>
      <text x="0" y="16" fill="#34d399" font-family="monospace" font-size="10">[+] Coordinates matched: Telea pass</text>
      <text x="0" y="32" fill="#a7f3d0" font-family="monospace" font-size="10">[✓] Clean output saved without watermark</text>
    </g>
  </g>

  <!-- Right: Info Details -->
  <g transform="translate(410, 100)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="130" height="26" rx="13" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="70" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">OPEN SOURCE</text>

    <!-- Main Title -->
    <text x="0" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">Gemini Watermark</text>
    <text x="0" y="104" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">Remover</text>
    
    <text x="0" y="140" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Computer Vision Inpainting Algorithm for AI Visuals</text>

    <!-- Key specs pills -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="80" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OpenCV Inpainting</text>

      <rect x="170" y="0" width="140" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="240" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Batch Processing</text>
    </g>

    <!-- Tech specs -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="600">PYTHON • OPENCV • NUMPY • COMPUTER VISION</text>
    </g>
  </g>
</svg>
