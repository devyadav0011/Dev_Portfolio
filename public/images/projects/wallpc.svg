<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a12"/>
      <stop offset="60%" stop-color="#120c1e"/>
      <stop offset="100%" stop-color="#1f0a14"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31103f"/>
      <stop offset="40%" stop-color="#721344"/>
      <stop offset="70%" stop-color="#d93b3b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="wallGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#wallBg)"/>

  <!-- Left: Stylized Dual Display Wallpaper Canvas -->
  <g transform="translate(70, 75)">
    <!-- Monitor Bezel Outer -->
    <rect x="0" y="0" width="310" height="210" rx="14" fill="#0c0d14" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    
    <!-- Screen Display Area -->
    <g transform="translate(10, 10)">
      <rect x="0" y="0" width="290" height="190" rx="8" fill="url(#skyGrad)"/>
      
      <!-- Sun -->
      <circle cx="145" cy="110" r="38" fill="#fef08a" opacity="0.9" filter="url(#wallGlow)"/>
      
      <!-- Mountain silhouettes -->
      <polygon points="0,190 70,110 145,160 210,95 290,190" fill="#1e1026" opacity="0.95"/>
      <polygon points="50,190 120,135 190,175 250,130 290,190" fill="#0f0715"/>
      
      <!-- Grid reflection lines -->
      <line x1="0" y1="185" x2="290" y2="185" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
      
      <!-- Ultra HD badge on screen -->
      <rect x="12" y="12" width="55" height="20" rx="4" fill="rgba(0,0,0,0.6)"/>
      <text x="39" y="26" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">4K UHD</text>
    </g>

    <!-- Monitor Stand -->
    <rect x="135" y="210" width="40" height="50" fill="#141724" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="95" y="258" width="120" height="12" rx="6" fill="#1d2235" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  </g>

  <!-- Right: Project Description & Features -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="135" height="26" rx="13" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#f59e0b"/>
    <text x="75" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WEB PRODUCT</text>

    <text x="0" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">WallPC / Nimwall</text>
    <text x="0" y="102" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Curated Ultra-HD Wallpaper Exploration Platform</text>

    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">4K &amp; Ultra-Wide</text>

      <rect x="160" y="0" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="235" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Zero-Ad Interface</text>

      <rect x="0" y="44" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="65" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Palette Search</text>

      <rect x="160" y="44" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="235" y="65" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Fast CDN Sync</text>
    </g>

    <g transform="translate(0, 245)">
      <text x="0" y="0" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600">REACT • NEXT.JS • TAILWIND CSS • UNSPLASH API</text>
    </g>
  </g>
</svg>
